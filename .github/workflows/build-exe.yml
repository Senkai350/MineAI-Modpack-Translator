name: Build Windows EXE

# Сборка MineAI_Translator.exe на windows-раннере — та же команда PyInstaller,
# что и в build.bat. Запускается вручную (Actions → Run workflow) или по тегу v*.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -r requirements.txt pyinstaller -q

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --icon="icon.ico" --name "MineAI_Translator" mineai\__main__.py

      - name: Verify artifact exists
        run: |
          if (-not (Test-Path "dist\MineAI_Translator.exe")) { throw "EXE was not produced" }
          "Size: {0:N1} MB" -f ((Get-Item "dist\MineAI_Translator.exe").Length / 1MB)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineAI_Translator-windows
          path: dist/MineAI_Translator.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MineAI_Translator.exe
